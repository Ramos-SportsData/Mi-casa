<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mis listas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📌</text></svg>">
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1d1d1b;--mut:#77736b;--ac:#1f6b4a;--ln:#e5e1d9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#222220;--tx:#f1eee8;--mut:#9b968c;--ac:#4fc08c;--ln:#33332f;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:18px 16px 4px}h1{margin:0;font-size:24px}header p{margin:4px 0 0;color:var(--mut);font-size:14px}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:20px;padding:9px 14px;font-size:15px;font-family:inherit;white-space:nowrap}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.tab.add{color:var(--mut);border-style:dashed}
.tools{display:flex;gap:8px;padding:0 12px}.tools input{flex:1}.tools select{flex:0 0 40%}
.lnk{padding:8px 14px 0;font-size:13px;color:var(--mut);display:flex;gap:14px;flex-wrap:wrap}.lnk a{color:var(--mut)}
.cat{margin:10px 12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.cat>button{all:unset;display:flex;width:100%;padding:16px;align-items:center;justify-content:space-between;font-weight:600;font-size:17px;cursor:pointer;box-sizing:border-box}
.cat>button span{color:var(--mut);font-weight:400;font-size:14px}
.arrow{display:inline-block;transition:transform .2s;margin-left:10px}.cat.open .arrow{transform:rotate(180deg)}
.body{display:none;padding:0 0 12px}.cat.open .body{display:block}
.empty{color:var(--mut);font-size:14px;padding:0 16px 6px}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 12px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}
.prod{flex:0 0 74%;max-width:300px;scroll-snap-align:start;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--bg);position:relative}
.prod img,.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--ln)}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
.badge{position:absolute;top:8px;left:8px;background:#d99a00;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px}
.info{padding:10px 12px 12px}.store{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.name{font-weight:600;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{color:var(--ac);font-weight:700;font-size:18px;min-height:1px}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;padding:11px;border-radius:10px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;border:0;font-size:15px;font-family:inherit}
.btn.sec{flex:0 0 auto;background:transparent;color:var(--mut);border:1px solid var(--ln);padding:11px 13px}
.btn:disabled{opacity:.6}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ac);color:#fff;border:0;border-radius:28px;padding:15px 22px;font-size:16px;font-weight:700;box-shadow:0 4px 14px #0004;font-family:inherit}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 6px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
textarea{resize:vertical}details{margin-top:10px;color:var(--mut);font-size:14px}
.sum{font-size:13px;color:var(--mut);margin-top:4px}.sum b{color:#d99a00}
.note{border-top:1px solid var(--ln);padding:10px 0}.note .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.note .st{color:#d99a00;letter-spacing:1px}.note p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
#stars button{all:unset;font-size:30px;color:#d99a00;padding:2px 4px;cursor:pointer}
.login{max-width:360px;margin:18vh auto 0;padding:0 20px;text-align:center}.login .btn{width:100%;margin-top:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var API='https://kxlhflysvyerwriqkahb.supabase.co/functions/v1/api';
var code=localStorage.getItem('mc_code')||'',boards=[],cats=[],items=[],notes=[],cur=localStorage.getItem('mc_board')||'',sort='recent',q='',err='',fp='',open={},curNote=null,rt=0;
var TPL={casa:{e:'🏠',n:'Mi casa',c:'Sofás, Armarios, Televisiones, Mesas, Camas, Iluminación'},nochevieja:{e:'🥂',n:'Nochevieja',c:'Hoteles, Casas rurales, Restaurantes, Planes'},viaje:{e:'✈️',n:'Viaje',c:'Alojamiento, Vuelos, Actividades, Restaurantes'},regalos:{e:'🎁',n:'Regalos',c:'Para ella, Para él, Para casa'},vacia:{e:'📌',n:'',c:''}};
try{open=JSON.parse(localStorage.getItem('mc_open')||'{}')}catch(e){}
function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},4500)}
function call(action,data){
  var b=Object.assign({action:action,code:code},data||{});
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'error');e.code=j.error;throw e}return j})});
}
function applyData(d){boards=d.boards||[];cats=d.cats||[];items=d.items||[];notes=d.notes||[];if(!boards.some(function(b){return b.id===cur}))cur=boards[0]?boards[0].id:''}
try{var cc=JSON.parse(localStorage.getItem('mc_cache2')||'null');if(cc)applyData(cc)}catch(e){}

function showLogin(msg){
  $('app').innerHTML='<div class="login"><h1>📌 Mis listas</h1><p style="color:var(--mut)">Escribe el código que compartís los dos</p><input id="cd" placeholder="casa-xxxxxxxxxx" autocapitalize="off" autocomplete="off"><button class="btn" onclick="login()">Entrar</button><p style="color:#c0392b;font-size:14px">'+esc(msg||'')+'</p></div>';
}
function login(){code=$('cd').value.trim();call('check').then(function(){localStorage.setItem('mc_code',code);start()}).catch(function(){showLogin('Código incorrecto')})}
function logout(){localStorage.removeItem('mc_code');code='';clearInterval(start.t);showLogin()}

function layout(){
  $('app').innerHTML='<header><h1>📌 Mis listas</h1><p>Pega enlaces de cualquier web y comparadlos juntos. <a href="#" onclick="logout();return false" style="color:var(--mut)">Salir</a></p></header><div id="tabs"></div>'+
  '<div class="tools"><input id="q" type="search" placeholder="Buscar…" oninput="q=this.value;render()"><select onchange="sort=this.value;render()"><option value="recent">Recientes</option><option value="price">Más baratos</option><option value="rating">Mejor nota</option></select></div>'+
  '<div id="err"></div><div id="menu" class="lnk"></div><main id="list"></main><button class="fab" onclick="openSheet()">+ Añadir enlace</button>'+
  '<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><h2>Nuevo enlace</h2><label>Enlace de la web</label><input id="url" type="url" placeholder="https://..." inputmode="url"><label>Categoría</label><select id="ct"></select>'+
  '<details><summary>Datos manuales (opcional)</summary><label>Nombre</label><input id="nm"><label>Precio</label><input id="pr" placeholder="799 €"><label>URL de la imagen</label><input id="im" type="url" placeholder="https://...jpg"></details>'+
  '<div class="acts" style="margin-top:16px"><button class="btn sec" onclick="closeSheet()">Cancelar</button><button class="btn" id="sv" onclick="save()">Guardar</button></div></div></div>'+
  '<div class="sheet" id="bsheet" onclick="if(event.target===this)closeBoard()"><div class="panel"><h2>Nueva lista</h2><label>Plantilla</label><select id="bt" onchange="applyTpl()"><option value="nochevieja">🥂 Nochevieja</option><option value="viaje">✈️ Viaje</option><option value="casa">🏠 Casa y muebles</option><option value="regalos">🎁 Regalos</option><option value="vacia">📌 En blanco</option></select>'+
  '<label>Nombre</label><input id="bn"><label>Emoji</label><input id="be" maxlength="4"><label>Categorías (separadas por comas)</label><input id="bc">'+
  '<div class="acts" style="margin-top:16px"><button class="btn sec" onclick="closeBoard()">Cancelar</button><button class="btn" onclick="saveBoard()">Crear lista</button></div></div></div>'+
  '<div class="sheet" id="nsheet" onclick="if(event.target===this)closeNotes()"><div class="panel"><h2 id="ntitle">Notas</h2><div id="nlist"></div><label>Tu nota</label><div id="stars"></div><label>Comentario</label><textarea id="ntext" rows="3" placeholder="Me gusta, pero queda lejos…"></textarea>'+
  '<div class="acts" style="margin-top:14px"><button class="btn sec" onclick="closeNotes()">Cerrar</button><button class="btn" onclick="sendNote()">Enviar</button></div></div></div>';
}

/* ---------- utilidades ---------- */
function curBoard(){return boards.filter(function(b){return b.id===cur})[0]}
function boardCats(){return cats.filter(function(c){return c.board_id===cur}).sort(function(a,b){return a.position-b.position}).map(function(c){return c.name})}
function num(p){var s=(String(p||'').match(/\d[\d.,]*/)||[''])[0];if(!s)return NaN;
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(!/\.\d{1,2}$/.test(s))s=s.replace(/\./g,'');
  var v=parseFloat(s);return isNaN(v)?NaN:v}
function itemNotes(id){return notes.filter(function(n){return n.item_id===id})}
function avg(id){var by={};itemNotes(id).forEach(function(n){if(n.rating)by[n.author||'Anónimo']=n.rating});var k=Object.keys(by);return k.length?k.reduce(function(a,x){return a+by[x]},0)/k.length:0}
function starTxt(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
function summ(id){
  var ns=itemNotes(id);if(!ns.length)return '';
  var by={};ns.forEach(function(n){if(n.rating)by[n.author||'Anónimo']=n.rating});
  var names=Object.keys(by),h='';
  if(names.length)h+='<div class="sum"><b>★ '+avg(id).toFixed(1).replace('.',',')+'</b> · '+names.map(function(k){return esc(k)+' '+by[k]+'/5'}).join(' · ')+'</div>';
  var last=ns.filter(function(n){return n.text}).pop();
  if(last)h+='<div class="sum">💬 '+esc(last.author||'')+': “'+esc(last.text.slice(0,70))+(last.text.length>70?'…':'')+'”</div>';
  return h;
}
function sorted(a){
  var r=a.slice();
  if(sort==='price')r.sort(function(x,y){var p=num(x.price),q2=num(y.price);if(isNaN(p))return isNaN(q2)?0:1;if(isNaN(q2))return -1;return p-q2});
  if(sort==='rating')r.sort(function(x,y){return avg(y.id)-avg(x.id)});
  return r;
}

/* ---------- pintado ---------- */
function card(i,cheapId){
  return '<article class="prod">'+(i.id===cheapId?'<span class="badge">💰 Más barato</span>':'')+
  (i.image?'<img src="'+esc(i.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=ph>Sin foto</div>\'">':'<div class="ph">Sin foto</div>')+
  '<div class="info"><div class="store">'+esc(i.store)+'</div><div class="name">'+esc(i.title)+'</div><div class="price">'+esc(i.price)+'</div>'+summ(i.id)+
  '<div class="acts"><a class="btn" href="'+esc(i.url)+'" target="_blank" rel="noopener">Abrir</a><button class="btn sec" onclick="openNotes(\''+i.id+'\')">💬'+(itemNotes(i.id).length||'')+'</button><button class="btn sec" onclick="edit(\''+i.id+'\')">✏️</button><button class="btn sec" onclick="del(\''+i.id+'\')">🗑</button></div></div></article>';
}
function group(name,its,ci,real){
  var key=cur+'|'+name,h='<section class="cat'+(open[key]?' open':'')+'"><button onclick="tog(\''+(real?ci:'x')+'\')">'+esc(name)+'<span>'+its.length+'<b class="arrow">⌄</b></span></button><div class="body">';
  if(real)h+='<div class="lnk" style="padding:0 16px 8px"><a href="#" onclick="renCat('+ci+');return false">Renombrar</a><a href="#" onclick="delCat('+ci+');return false">Borrar categoría</a></div>';
  if(!its.length)h+='<div class="empty">Aún no hay nada aquí.</div>';
  else{
    var s=sorted(its),cheap='',min=Infinity,cnt=0;
    its.forEach(function(i){var p=num(i.price);if(!isNaN(p)){cnt++;if(p<min){min=p;cheap=i.id}}});
    if(cnt<2)cheap='';
    h+='<div class="row">'+s.map(function(i){return card(i,cheap)}).join('')+'</div>';
  }
  return h+'</div></section>';
}
function render(){
  var t='';boards.forEach(function(b){t+='<button class="tab'+(b.id===cur?' on':'')+'" onclick="pick(\''+b.id+'\')">'+esc(b.emoji)+' '+esc(b.name)+'</button>'});
  t+='<button class="tab add" onclick="openBoard()">+ Lista</button>';
  if($('tabs'))$('tabs').innerHTML=t;
  var e=$('err');if(e)e.innerHTML=err?'<div class="cat" style="padding:14px;border-color:#c0392b"><b>⚠️ No puedo conectar con el servidor.</b><div style="color:var(--mut);font-size:14px;margin:4px 0 10px">'+esc(err)+' Abre esta web desde su enlace normal en el navegador, no desde una vista previa.</div><button class="btn" onclick="refresh(true)">Reintentar</button></div>':'';
  var b=curBoard(),m=$('list');if(!m)return;
  if(!b){$('menu').innerHTML='';m.innerHTML=err?'':'<div class="empty" style="padding:20px">Cargando…</div>';return}
  $('menu').innerHTML='<a href="#" onclick="addCat();return false">+ Categoría</a><a href="#" onclick="renBoard();return false">Renombrar lista</a><a href="#" onclick="delBoard();return false">Borrar lista</a>';
  var names=boardCats(),ql=q.toLowerCase();
  var its=items.filter(function(i){return i.board_id===cur&&(!ql||(i.title+' '+i.store+' '+i.category).toLowerCase().indexOf(ql)>=0)});
  var h='';
  names.forEach(function(n,ci){h+=group(n,its.filter(function(i){return i.category===n}),ci,true)});
  var other=its.filter(function(i){return names.indexOf(i.category)<0});
  if(other.length||!names.length)h+=group(names.length?'Sin categoría':'Enlaces',other,0,false);
  m.innerHTML=h;
}
function tog(ci){var names=boardCats(),n=ci==='x'?(names.length?'Sin categoría':'Enlaces'):names[ci],k=cur+'|'+n;open[k]=!open[k];try{localStorage.setItem('mc_open',JSON.stringify(open))}catch(e){}render()}
function pick(id){cur=id;try{localStorage.setItem('mc_board',id)}catch(e){}render()}

/* ---------- datos ---------- */
function refresh(force){
  if(document.hidden&&!force)return Promise.resolve();
  return call('list').then(function(d){err='';var f=JSON.stringify(d);if(f!==fp){fp=f;applyData(d);try{localStorage.setItem('mc_cache2',JSON.stringify(d))}catch(x){}}render();renderNoteList()}).catch(function(e){err=e.code?('Error: '+e.code+'.'):'La petición no llega al servidor.';render()});
}
function start(){layout();fp='';render();refresh(true);clearInterval(start.t);start.t=setInterval(refresh,6000)}
function act(a,d,okMsg){return call(a,d).then(function(r){return refresh(true).then(function(){return r})}).catch(function(){toast('No se pudo completar')})}

/* ---------- listas y categorías ---------- */
function openBoard(){$('bt').value='nochevieja';applyTpl();$('bsheet').classList.add('show')}
function closeBoard(){$('bsheet').classList.remove('show')}
function applyTpl(){var t=TPL[$('bt').value];$('bn').value=t.n;$('be').value=t.e;$('bc').value=t.c}
function saveBoard(){
  var n=$('bn').value.trim();if(!n){toast('Ponle un nombre a la lista');return}
  var cs=$('bc').value.split(',').map(function(x){return x.trim()}).filter(Boolean);
  call('addBoard',{name:n,emoji:$('be').value.trim()||'📌',cats:cs}).then(function(r){cur=r.id;try{localStorage.setItem('mc_board',cur)}catch(e){}closeBoard();return refresh(true)}).catch(function(){toast('No se pudo crear')});
}
function renBoard(){var b=curBoard(),n=prompt('Nuevo nombre de la lista',b.name);if(n&&n.trim())act('renBoard',{id:cur,name:n.trim()})}
function delBoard(){
  if(boards.length<=1){toast('Tiene que quedar al menos una lista');return}
  if(confirm('¿Borrar esta lista con todos sus enlaces y notas? No se puede deshacer.'))act('delBoard',{id:cur})
}
function addCat(){var n=prompt('Nombre de la categoría');if(n&&n.trim())act('addCat',{board_id:cur,name:n.trim()})}
function renCat(ci){var o=boardCats()[ci],n=prompt('Nuevo nombre',o);if(n&&n.trim()&&n.trim()!==o)act('renCat',{board_id:cur,name:o,new_name:n.trim()})}
function delCat(ci){var o=boardCats()[ci];if(confirm('¿Borrar la categoría «'+o+'»? Sus enlaces pasan a «Sin categoría».'))act('delCat',{board_id:cur,name:o})}

/* ---------- enlaces ---------- */
function openSheet(){
  var s=$('ct');s.innerHTML=boardCats().map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'<option value="">Sin categoría</option>';
  ['url','nm','pr','im'].forEach(function(k){$(k).value=''});$('sheet').classList.add('show');
}
function closeSheet(){$('sheet').classList.remove('show')}
function save(){
  var u=$('url').value.trim();
  if(!/^https?:\/\//i.test(u)){toast('Pega un enlace que empiece por http');return}
  var b=$('sv'),cat=$('ct').value;
  b.disabled=true;b.textContent='Leyendo enlace…';
  call('add',{board_id:cur,url:u,category:cat,title:$('nm').value,price:$('pr').value,image:$('im').value}).then(function(d){
    open[cur+'|'+(cat||'Sin categoría')]=true;try{localStorage.setItem('mc_open',JSON.stringify(open))}catch(e){}
    closeSheet();refresh(true);
    if(!d.found.image)toast('No pude sacar la foto de esa web. Pulsa ✏️ y pega la URL de una imagen.');
    else if(!d.found.price)toast('Guardado. No encontré el precio: ponlo con ✏️.');
  }).catch(function(){toast('No se pudo guardar. Revisa el enlace.')}).then(function(){b.disabled=false;b.textContent='Guardar'});
}
function edit(id){
  var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  var t=prompt('Nombre',it.title);if(t===null)return;
  var p=prompt('Precio',it.price);if(p===null)return;
  var im=prompt('URL de la imagen',it.image);if(im===null)return;
  var names=boardCats(),c=prompt('Categoría ('+names.join(', ')+')',it.category);if(c===null)return;
  act('update',{id:id,title:t,price:p,image:im,category:c.trim()});
}
function del(id){if(confirm('¿Borrar este enlace?'))act('del',{id:id})}

/* ---------- notas ---------- */
function nm(){var n=localStorage.getItem('mc_name');if(!n){n=prompt('¿Cómo te llamas? (firmará tus notas)');n=n&&n.trim();if(n)localStorage.setItem('mc_name',n)}return n||'Anónimo'}
function setRt(n){rt=(rt===n?0:n);var h='';for(var k=1;k<=5;k++)h+='<button onclick="setRt('+k+')">'+(k<=rt?'★':'☆')+'</button>';$('stars').innerHTML=h}
function openNotes(id){curNote=id;rt=0;setRt(0);$('ntext').value='';var it=items.filter(function(i){return i.id===id})[0];$('ntitle').textContent=it?it.title.slice(0,60):'Notas';renderNoteList();$('nsheet').classList.add('show')}
function closeNotes(){curNote=null;$('nsheet').classList.remove('show')}
function renderNoteList(){
  var el=$('nlist');if(!el||!curNote)return;
  var ns=itemNotes(curNote),me=localStorage.getItem('mc_name')||'';
  el.innerHTML=ns.length?ns.map(function(n){
    var d=new Date(n.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    return '<div class="note"><div class="h"><span><b style="color:var(--tx)">'+esc(n.author||'Anónimo')+'</b> · '+d+'</span>'+(n.author&&n.author===me?'<a href="#" style="color:var(--mut)" onclick="delNote(\''+n.id+'\');return false">borrar</a>':'')+'</div>'+(n.rating?'<div class="st">'+starTxt(n.rating)+'</div>':'')+(n.text?'<p>'+esc(n.text)+'</p>':'')+'</div>'}).join(''):'<div class="empty" style="padding:8px 0">Todavía no hay notas. ¡Sé el primero!</div>';
}
function sendNote(){
  var t=$('ntext').value.trim();
  if(!t&&!rt){toast('Pon una nota o escribe un comentario');return}
  var a=nm();
  call('addNote',{item_id:curNote,author:a,rating:rt||null,text:t}).then(function(){$('ntext').value='';setRt(0);return refresh(true)}).catch(function(){toast('No se pudo enviar')});
}
function delNote(id){if(confirm('¿Borrar tu nota?'))act('delNote',{id:id})}

document.addEventListener('visibilitychange',function(){if(!document.hidden&&code)refresh(true)});
if(code)start();else showLogin();
</script>
