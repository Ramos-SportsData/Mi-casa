<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6b4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Casa</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
<style>
:root{--bg:#f6f4f0;--card:#fff;--tx:#1d1d1b;--mut:#77736b;--ac:#1f6b4a;--ln:#e5e1d9;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#151513;--card:#222220;--tx:#f1eee8;--mut:#9b968c;--ac:#4fc08c;--ln:#33332f;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
header{padding:20px 16px 8px}h1{margin:0;font-size:26px}header p{margin:4px 0 0;color:var(--mut);font-size:14px}
.cat{margin:10px 12px;background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.cat>button{all:unset;display:flex;width:100%;padding:16px;align-items:center;justify-content:space-between;font-weight:600;font-size:17px;cursor:pointer;box-sizing:border-box}
.cat>button span{color:var(--mut);font-weight:400;font-size:14px}
.arrow{display:inline-block;transition:transform .2s;margin-left:10px}.cat.open .arrow{transform:rotate(180deg)}
.body{display:none;padding:0 0 12px}.cat.open .body{display:block}
.empty{color:var(--mut);font-size:14px;padding:0 16px 6px}
.row{display:flex;flex-direction:column;gap:12px;padding:0 12px}
.prod{border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--bg)}
.prod img,.ph{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--ln)}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
.info{padding:10px 12px 12px}.store{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.name{font-weight:600;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{color:var(--ac);font-weight:700;font-size:18px;min-height:1px}
.sum{font-size:13px;color:var(--mut);margin-top:4px}.sum b{color:#d99a00}
.acts{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;padding:11px;border-radius:10px;background:var(--ac);color:#fff;text-decoration:none;font-weight:600;border:0;font-size:15px;font-family:inherit}
.btn.sec{flex:0 0 auto;background:transparent;color:var(--mut);border:1px solid var(--ln);padding:11px 13px}
.btn:disabled{opacity:.6}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ac);color:#fff;border:0;border-radius:28px;padding:15px 22px;font-size:16px;font-weight:700;box-shadow:0 4px 14px #0004;font-family:inherit}
.sheet{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:20}.sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.panel h2{margin:0 0 6px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
textarea{resize:vertical}details{margin-top:10px;color:var(--mut);font-size:14px}
.note{border-top:1px solid var(--ln);padding:10px 0}.note .h{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}.note .st{color:#d99a00;letter-spacing:1px}.note p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
#stars button{all:unset;font-size:30px;color:#d99a00;padding:2px 4px;cursor:pointer}
.login{max-width:360px;margin:18vh auto 0;padding:0 20px;text-align:center}.login .btn{width:100%;margin-top:12px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;display:none;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
var API='https://kxlhflysvyerwriqkahb.supabase.co/functions/v1/api';
var code=localStorage.getItem('mc_code')||'',cats=[],items=[],notes=[],open={},fp='',err='',q='',curNote=null,rt=0;
try{open=JSON.parse(localStorage.getItem('mc_open')||'{}')}catch(e){}
function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},4500)}
function call(action,data){
  var b=Object.assign({action:action,code:code},data||{});
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().then(function(j){if(!r.ok){var e=new Error(j.error||'error');e.code=j.error;throw e}return j})});
}
function applyData(d){cats=(d.cats||[]).map(function(c){return typeof c==='string'?c:c.name});items=d.items||[];notes=d.notes||[]}
try{var cc=JSON.parse(localStorage.getItem('mc_cache3')||'null');if(cc)applyData(cc)}catch(e){}

function showLogin(msg){
  $('app').innerHTML='<div class="login"><h1>🏠 Mi Casa</h1><p style="color:var(--mut)">Escribe el código que compartís los dos</p><input id="cd" placeholder="casa-xxxxxxxxxx" autocapitalize="off" autocomplete="off"><button class="btn" onclick="login()">Entrar</button><p style="color:#c0392b;font-size:14px">'+esc(msg||'')+'</p></div>';
}
function login(){code=$('cd').value.trim();call('check').then(function(){localStorage.setItem('mc_code',code);start()}).catch(function(e){showLogin(e.code==='code'?'Código incorrecto':'No consigo conectar con el servidor. Abre la web desde su enlace en Safari o Chrome, no desde la vista previa del chat.')})}
function logout(){localStorage.removeItem('mc_code');code='';clearInterval(start.t);showLogin()}
function layout(){
  $('app').innerHTML='<header><h1>🏠 Mi Casa</h1><p>Pega enlaces de cualquier tienda: yo saco foto, nombre y precio. <a href="#" onclick="logout();return false" style="color:var(--mut)">Salir</a></p></header>'+
  '<div style="padding:4px 12px"><input id="q" type="search" placeholder="Buscar en mis productos…" oninput="q=this.value;render()"></div><div id="err"></div><main id="list"></main><button class="fab" onclick="openSheet()">+ Añadir enlace</button><button class="fab" style="left:16px;right:auto;background:var(--card);color:var(--tx);border:1px solid var(--ln)" onclick="Casa3D.open()">🧊 Casa 3D</button>'+
  '<div class="sheet" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="panel"><h2>Nuevo producto</h2><label>Enlace de la tienda</label><input id="url" type="url" placeholder="https://..." inputmode="url"><label>Categoría</label><select id="ct"></select>'+
  '<details><summary>Datos manuales (opcional)</summary><label>Nombre</label><input id="nm"><label>Precio</label><input id="pr" placeholder="799 €"><label>URL de la imagen</label><input id="im" type="url" placeholder="https://...jpg"></details>'+
  '<div class="acts" style="margin-top:16px"><button class="btn sec" onclick="closeSheet()">Cancelar</button><button class="btn" id="sv" onclick="save()">Guardar</button></div></div></div>'+
  '<div class="sheet" id="nsheet" onclick="if(event.target===this)closeNotes()"><div class="panel"><h2 id="ntitle">Notas</h2><div id="nlist"></div><label>Tu nota</label><div id="stars"></div><label>Comentario</label><textarea id="ntext" rows="3" placeholder="Me gusta, pero es muy grande…"></textarea>'+
  '<div class="acts" style="margin-top:14px"><button class="btn sec" onclick="closeNotes()">Cerrar</button><button class="btn" onclick="sendNote()">Enviar</button></div></div></div>';
}

function itemNotes(id){return notes.filter(function(n){return n.item_id===id})}
function starTxt(n){return '★★★★★'.slice(0,n)+'☆☆☆☆☆'.slice(0,5-n)}
function summ(id){
  var ns=itemNotes(id);if(!ns.length)return '';
  var by={};ns.forEach(function(n){if(n.rating)by[n.author||'Anónimo']=n.rating});
  var names=Object.keys(by),h='';
  if(names.length){var a=names.reduce(function(s,k){return s+by[k]},0)/names.length;h+='<div class="sum"><b>★ '+a.toFixed(1).replace('.',',')+'</b> · '+names.map(function(k){return esc(k)+' '+by[k]+'/5'}).join(' · ')+'</div>'}
  var last=ns.filter(function(n){return n.text}).pop();
  if(last)h+='<div class="sum">💬 '+esc(last.author||'')+': “'+esc(last.text.slice(0,70))+(last.text.length>70?'…':'')+'”</div>';
  return h;
}
function card(i){
  return '<article class="prod">'+(i.image?'<img src="'+esc(i.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML=\'<div class=ph>Sin foto</div>\'">':'<div class="ph">Sin foto</div>')+
  '<div class="info"><div class="store">'+esc(i.store)+'</div><div class="name">'+esc(i.title)+'</div><div class="price">'+esc(i.price)+'</div>'+summ(i.id)+
  '<div class="acts"><a class="btn" href="'+esc(i.url)+'" target="_blank" rel="noopener">Ver en tienda</a><button class="btn sec" onclick="openNotes(\''+i.id+'\')">💬'+(itemNotes(i.id).length||'')+'</button><button class="btn sec" onclick="Casa3D.place(\''+i.id+'\')">📍</button><button class="btn sec" onclick="edit(\''+i.id+'\')">✏️</button><button class="btn sec" onclick="del(\''+i.id+'\')">🗑</button></div></div></article>';
}
function group(name,its,idx){
  var h='<section class="cat'+(open[name]?' open':'')+'"><button onclick="tog('+idx+')">'+esc(name)+'<span>'+its.length+'<b class="arrow">⌄</b></span></button><div class="body">';
  h+=its.length?'<div class="row">'+its.map(card).join('')+'</div>':'<div class="empty">Aún no hay nada aquí.</div>';
  return h+'</div></section>';
}
function render(){
  var e=$('err');if(e)e.innerHTML=err?'<div class="cat" style="padding:14px;border-color:#c0392b"><b>⚠️ No puedo conectar con el servidor.</b><div style="color:var(--mut);font-size:14px;margin:4px 0 10px">'+esc(err)+' Abre esta web desde su enlace normal en el navegador.</div><button class="btn" onclick="refresh(true)">Reintentar</button></div>':'';
  var m=$('list');if(!m)return;
  var ql=q.toLowerCase(),its=items.filter(function(i){return !ql||(i.title+' '+i.store).toLowerCase().indexOf(ql)>=0});
  var h='';
  cats.forEach(function(c,k){h+=group(c,its.filter(function(i){return i.category===c}),k)});
  var other=its.filter(function(i){return cats.indexOf(i.category)<0});
  if(other.length)h+=group('Sin categoría',other,-1);
  m.innerHTML=h;
}
function tog(k){var n=k<0?'Sin categoría':cats[k];open[n]=!open[n];try{localStorage.setItem('mc_open',JSON.stringify(open))}catch(e){}render()}
function refresh(force){
  if(document.hidden&&!force)return Promise.resolve();
  return call('list').then(function(d){var was=err;err='';var f=JSON.stringify(d);if(f!==fp){fp=f;applyData(d);try{localStorage.setItem('mc_cache3',JSON.stringify(d))}catch(x){}render();renderNoteList()}else if(was)render()}).catch(function(e){err=e.code?('Error: '+e.code+'.'):'La petición no llega al servidor.';render()});
}
function start(){layout();fp='';render();refresh(true);clearInterval(start.t);start.t=setInterval(refresh,6000)}
function openSheet(){$('ct').innerHTML=cats.map(function(c){return '<option>'+esc(c)+'</option>'}).join('');['url','nm','pr','im'].forEach(function(k){$(k).value=''});$('sheet').classList.add('show')}
function closeSheet(){$('sheet').classList.remove('show')}
function save(){
  var u=$('url').value.trim();
  if(!/^https?:\/\//i.test(u)){toast('Pega un enlace que empiece por http');return}
  var b=$('sv'),cat=$('ct').value;
  b.disabled=true;b.textContent='Leyendo enlace…';
  call('add',{url:u,category:cat,title:$('nm').value,price:$('pr').value,image:$('im').value}).then(function(d){
    open[cat]=true;try{localStorage.setItem('mc_open',JSON.stringify(open))}catch(e){}
    closeSheet();refresh(true);
    if(!d.found.image)toast('No pude sacar la foto de esa tienda. Pulsa ✏️ y pega la URL de una imagen.');
    else if(!d.found.price)toast('Guardado. No encontré el precio: ponlo con ✏️.');
  }).catch(function(){toast('No se pudo guardar. Revisa el enlace.')}).then(function(){b.disabled=false;b.textContent='Guardar'});
}
function edit(id){
  var it=items.filter(function(i){return i.id===id})[0];if(!it)return;
  var t=prompt('Nombre',it.title);if(t===null)return;
  var p=prompt('Precio',it.price);if(p===null)return;
  var im=prompt('URL de la imagen',it.image);if(im===null)return;
  var c=prompt('Categoría: '+cats.join(', '),it.category);if(c===null)return;
  call('update',{id:id,title:t,price:p,image:im,category:c.trim()}).then(function(){refresh(true)}).catch(function(){toast('No se pudo guardar')});
}
function del(id){if(confirm('¿Borrar este producto?'))call('del',{id:id}).then(function(){refresh(true)}).catch(function(){toast('No se pudo borrar')})}

function nm(){var n=localStorage.getItem('mc_name');if(!n){n=prompt('¿Cómo te llamas? (firmará tus notas)');n=n&&n.trim();if(n)localStorage.setItem('mc_name',n)}return n||'Anónimo'}
function setRt(n){rt=(rt===n?0:n);var h='';for(var k=1;k<=5;k++)h+='<button onclick="setRt('+k+')">'+(k<=rt?'★':'☆')+'</button>';$('stars').innerHTML=h}
function openNotes(id){curNote=id;rt=0;setRt(0);$('ntext').value='';var it=items.filter(function(i){return i.id===id})[0];$('ntitle').textContent=it?it.title.slice(0,60):'Notas';renderNoteList();$('nsheet').classList.add('show')}
function closeNotes(){curNote=null;$('nsheet').classList.remove('show')}
function renderNoteList(){
  var el=$('nlist');if(!el||!curNote)return;
  var ns=itemNotes(curNote),me=localStorage.getItem('mc_name')||'';
  el.innerHTML=ns.length?ns.map(function(n){
    var d=new Date(n.created_at).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    return '<div class="note"><div class="h"><span><b style="color:var(--tx)">'+esc(n.author||'Anónimo')+'</b> · '+d+'</span>'+(n.author&&n.author===me?'<a href="#" style="color:var(--mut)" onclick="delNote(\''+n.id+'\');return false">borrar</a>':'')+'</div>'+(n.rating?'<div class="st">'+starTxt(n.rating)+'</div>':'')+(n.text?'<p>'+esc(n.text)+'</p>':'')+'</div>'}).join(''):'<div class="empty" style="padding:8px 0">Todavía no hay notas. ¡Sé el primero!</div>';
}
function sendNote(){
  var t=$('ntext').value.trim();
  if(!t&&!rt){toast('Pon una nota o escribe un comentario');return}
  var a=nm();
  call('addNote',{item_id:curNote,author:a,rating:rt||null,text:t}).then(function(){$('ntext').value='';setRt(0);return refresh(true)}).catch(function(){toast('No se pudo enviar')});
}
function delNote(id){if(confirm('¿Borrar tu nota?'))call('delNote',{id:id}).then(function(){refresh(true)}).catch(function(){toast('No se pudo borrar')})}
document.addEventListener('visibilitychange',function(){if(!document.hidden&&code)refresh(true)});
if(code)start();else showLogin();
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="casa3d.js"></script>
</body>
</html>
